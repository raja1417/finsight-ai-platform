replicaCount: 2
image:
  repository: ghcr.io/raja1417/finsight-container
  pullPolicy: IfNotPresent
  tag: latest
imagePullSecrets: []
serviceAccount:
  create: true
  name: ""
service:
  type: ClusterIP
  port: 80
  targetPort: 8080
ingress:
  enabled: false
  className: ""
  annotations: {}
  hosts:
    - host: finsight.example.com
      paths:
        - path: /
          pathType: Prefix
  tls: []
resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 500m
    memory: 512Mi
autoscaling:
  enabled: true
  minReplicas: 2
  maxReplicas: 5
  targetCPUUtilizationPercentage: 70
config:
  environment: development
secrets:
  databaseUrl: ""
